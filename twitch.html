

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
}

.player{
    position:relative;
    width:100%;
    max-width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
}

/* Small Play Button */
.play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:54px;
    height:54px;
    border-radius:50%;
    background:rgba(255,0,0,.95);
}

.play::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-35%,-50%);
    border-style:solid;
    border-width:10px 0 10px 16px;
    border-color:transparent transparent transparent #fff;
}

/* Progress Bar */
.progress{
    position:absolute;
    left:0;
    right:0;
    bottom:44px;
    height:3px;
    background:#333;
}

.progress span{
    display:block;
    width:35%;
    height:100%;
    background:#ff0000;
}

/* Controls */
.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:44px;
    background:rgba(20,20,20,.95);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    color:#fff;
    font-size:18px;
}

.left,
.right{
    display:flex;
    gap:16px;
    align-items:center;
}

@media (max-width:600px){

.play{
    width:42px;
    height:42px;
}

.play::before{
    border-width:8px 0 8px 13px;
}

.controls{
    height:38px;
    font-size:15px;
}

.progress{
    bottom:38px;
}

}
</style>


<div class="player" onclick="window.location.href='https://player.twitch.tv/?channel=hellosportsxz&muted=false&parent=majed-koora.co'">

    <div class="play"></div>

    <div class="progress">
        <span></span>
    </div>

    <div class="controls">
        <div class="left">
            &#9654; 🔊 &#9881;
        </div>

        <div class="right">
            &#9974;
        </div>
    </div>

</div>
