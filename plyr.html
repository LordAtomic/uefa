<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Hello Sports Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .b4x-wrap {
      width: 100%;
      max-width: 960px;
      background: #000;
    }

    .b4x-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }

    .b4x-player video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .plyr--video .plyr__control--overlaid {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
    }

    .b4x-join-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 99;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, .55);
      border: 2px solid #00ff00;
      border-radius: 4px;
    }

    #hx-watermark {
      position: absolute;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: .42;
      transition: opacity .5s ease;
    }

    .plyr--hide-controls #hx-watermark { opacity: .28; }
    :fullscreen #hx-watermark { opacity: .50; bottom: 10px; }

    .wm-rule {
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 179, 255, .7));
    }
    .wm-rule.right {
      background: linear-gradient(90deg, rgba(0, 179, 255, .7), transparent);
    }
    .wm-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .wm-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 1);
    }
    .wm-name .red { color: #00b3ff; }
    .wm-url {
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, .55);
      text-transform: uppercase;
    }

    /* Extra controls */
    .b4x-extra-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
      width: 100%;
      max-width: 960px;
    }

    .b4x-extra-btn {
      border: none;
      outline: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      background: #111;
      min-width: 110px;
      transition: .2s;
    }
    .b4x-extra-btn:hover { transform: scale(1.05); }
    .b4x-share      { background: #1877f2; }
    .b4x-refresh    { background: #e8001d; }
    .b4x-fullscreen { background: #00bfff; }

  </style>
</head>
<body>

  <div id="b4x-player-root" class="b4x-wrap" data-b4x="">
    <div class="b4x-player">

      <a href="https://hellosports.io/" target="_blank" class="b4x-join-btn">JOIN US</a>

      <div id="hx-watermark">
        <div class="wm-rule"></div>
        <div class="wm-inner">
          <span class="wm-name"><span class="red">HELLO</span> SPORTS</span>
          <span class="wm-url">hellosports.io</span>
        </div>
        <div class="wm-rule right"></div>
      </div>

      <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>

    </div>
  </div>

  <div class="b4x-extra-controls">
    <button class="b4x-extra-btn b4x-share"      onclick="b4xSharePlayer()">Share</button>
    <button class="b4x-extra-btn b4x-refresh"    onclick="location.reload()">Refresh</button>
    <button class="b4x-extra-btn b4x-fullscreen" onclick="b4xFullscreen()">Fullscreen</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.6.2/plyr.polyfilled.js"></script>
  <script>
    let plyrInstance = null;
    let hlsInstance = null;

    function initPlayer(videoURL) {
      const video = document.getElementById('player');

      // Destroy previous instances
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (plyrInstance) { plyrInstance.destroy(); plyrInstance = null; }

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

      if (isIOS) {
        video.src = videoURL;
        plyrInstance = new Plyr(video);
        return;
      }

      if (!Hls.isSupported()) {
        alert('HLS is not supported in this browser.');
        return;
      }

      hlsInstance = new Hls();
      hlsInstance.loadSource(videoURL);
      hlsInstance.attachMedia(video);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
        const qualities = [];
        hlsInstance.levels.forEach(function (level) {
          if (!qualities.includes(level.height)) qualities.push(level.height);
        });
        qualities.sort(function (a, b) { return b - a; });

        plyrInstance = new Plyr(video, {
          settings: ['quality', 'speed', 'fullscreen'],
          quality: {
            default: qualities[0] || 720,
            options: qualities,
            forced: true,
            onChange: function (q) {
              hlsInstance.levels.forEach(function (level, index) {
                if (level.height === q) hlsInstance.currentLevel = index;
              });
            }
          }
        });

        // Auto landscape lock on fullscreen (mobile)
        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement && screen.orientation?.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          } else if (screen.orientation?.unlock) {
            screen.orientation.unlock();
          }
        });

        // Click to play/pause
        video.addEventListener('click', function () {
          if (plyrInstance.playing) plyrInstance.pause();
          else plyrInstance.play();
        });
      });
    }

    // Auto-load from ?b4x= param or data-b4x attribute on page load
    (function () {
      const params = new URLSearchParams(location.search);
      let videoURL = params.get('x');
      if (!videoURL) {
        videoURL = document.getElementById('b4x-player-root').dataset.b4x;
      }
      if (videoURL) initPlayer(videoURL);
    })();

    function b4xSharePlayer() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: location.href });
      } else {
        navigator.clipboard.writeText(location.href);
        alert('Link Copied!');
      }
    }

    function b4xFullscreen() {
      const el = document.querySelector('.plyr') || document.querySelector('video');
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  </script>

</body>
</html>
