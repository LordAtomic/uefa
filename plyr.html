<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Hello Sports Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .player-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .plyr--video .plyr__control--overlaid {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
    }
  </style>
</head>
<body>

  <div class="player-wrap">
    <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.6.2/plyr.polyfilled.js"></script>
  <script>
    (function () {
      const video = document.getElementById('player');
      const params = new URLSearchParams(location.search);
      const videoURL = params.get('x');

      if (!videoURL) return;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

      if (isIOS) {
        video.src = videoURL;
        new Plyr(video);
        return;
      }

      if (!Hls.isSupported()) return;

      const hls = new Hls();
      hls.loadSource(videoURL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        const qualities = [];
        hls.levels.forEach(function (level) {
          if (!qualities.includes(level.height)) qualities.push(level.height);
        });
        qualities.sort(function (a, b) { return b - a; });

        const player = new Plyr(video, {
          settings: ['quality', 'speed', 'fullscreen'],
          quality: {
            default: qualities[0] || 720,
            options: qualities,
            forced: true,
            onChange: function (q) {
              hls.levels.forEach(function (level, index) {
                if (level.height === q) hls.currentLevel = index;
              });
            }
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement && screen.orientation?.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          } else if (screen.orientation?.unlock) {
            screen.orientation.unlock();
          }
        });

        video.addEventListener('click', function () {
          if (player.playing) player.pause();
          else player.play();
        });
      });
    })();
  </script>

</body>
</html>
